<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Deep Twilight High-Altitude Sky -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0c1e3d" />
      <stop offset="35%" stop-color="#1e295b" />
      <stop offset="70%" stop-color="#3b2d6b" />
      <stop offset="90%" stop-color="#7c3aed" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.4" />
    </linearGradient>

    <!-- Sunset Golden Horizon Atmospheric Glow -->
    <radialGradient id="sunsetGlow" cx="65%" cy="65%" r="65%">
      <stop offset="0%" stop-color="#fdba74" stop-opacity="0.35" />
      <stop offset="30%" stop-color="#f43f5e" stop-opacity="0.2" />
      <stop offset="60%" stop-color="#6366f1" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#0c1e3d" stop-opacity="0" />
    </radialGradient>

    <!-- Airplane Window Bezel Frame Gradient -->
    <linearGradient id="windowBezel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Cloud Soft Shading Gradients -->
    <linearGradient id="cloudGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45" />
      <stop offset="50%" stop-color="#cbd5e1" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#64748b" stop-opacity="0.05" />
    </linearGradient>

    <linearGradient id="cloudSunset" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa" stop-opacity="0.5" />
      <stop offset="60%" stop-color="#f472b6" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#312e81" stop-opacity="0.1" />
    </linearGradient>

    <!-- Airplane Window Mask -->
    <clipPath id="windowClip">
      <rect x="520" y="45" width="230" height="340" rx="90" />
    </clipPath>
  </defs>

  <!-- Deep Canvas Base -->
  <rect width="800" height="450" fill="#06101e" />

  <!-- The Sky and Clouds visible through & around the airplane frame -->
  <g clip-path="url(#windowClip)">
    <!-- High Altitude Sky -->
    <rect x="500" y="30" width="270" height="370" fill="url(#skyGrad)" />
    <rect x="500" y="30" width="270" height="370" fill="url(#sunsetGlow)" />

    <!-- Distant Mountain/Cloud Horizon Line -->
    <line x1="500" y1="240" x2="770" y2="240" stroke="#fcd34d" stroke-width="2" stroke-opacity="0.4" />

    <!-- Majestic Cloud Formations (Cumulus Cloud Tops) -->
    <!-- Far Cloud Layer (Illuminated by sunset) -->
    <path d="M 500,240 Q 530,225 560,230 Q 590,210 630,220 Q 670,205 710,225 Q 740,215 770,235 L 770,380 L 500,380 Z" fill="url(#cloudSunset)" />

    <!-- Near Cloud Pillows & Waves -->
    <path d="M 500,270 Q 540,250 580,265 Q 620,240 670,260 Q 720,245 770,275 L 770,400 L 500,400 Z" fill="url(#cloudGrad1)" />
    <path d="M 500,305 Q 550,285 600,300 Q 650,275 700,295 Q 740,285 770,310 L 770,410 L 500,410 Z" fill="#e2e8f0" fill-opacity="0.25" />

    <!-- Airplane Wing Silhouette Cutting Across Cloud Tops -->
    <!-- Swept-back Jet Wing -->
    <polygon points="500,290 680,210 705,212 610,320 500,340" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
    
    <!-- Wing Panel Seams & Flap Track Fairings -->
    <line x1="540" y1="290" x2="630" y2="250" stroke="#475569" stroke-width="1.2" stroke-opacity="0.6" />
    <line x1="580" y1="310" x2="670" y2="270" stroke="#475569" stroke-width="1.2" stroke-opacity="0.6" />

    <!-- Upward Winglet Tip -->
    <path d="M 680,210 L 705,212 L 712,180 L 695,182 Z" fill="#1e293b" stroke="#60a5fa" stroke-width="1" stroke-opacity="0.8" />
    <!-- Winglet Green/Red Navigation Beacon Light -->
    <circle cx="710" cy="184" r="3" fill="#38bdf8" />
    <circle cx="710" cy="184" r="8" fill="#38bdf8" fill-opacity="0.4" />
    
    <!-- Wing Top Reflected Ambient Light -->
    <polygon points="510,292 680,212 685,216 530,305" fill="#f8fafc" fill-opacity="0.18" />

    <!-- Cabin Glass Double-Pane Glare / Reflection Arc -->
    <path d="M 540,65 Q 635,50 730,120 Q 680,200 540,160 Z" fill="#ffffff" fill-opacity="0.04" />
  </g>

  <!-- Realistic Oval Aircraft Window Bezel & Thick Wall Frame -->
  <!-- Outer Frame Shadow & Bezel -->
  <rect x="508" y="33" width="254" height="364" rx="100" fill="none" stroke="#0f172a" stroke-width="16" stroke-opacity="0.9" />
  <!-- Inner Highlight Rim -->
  <rect x="518" y="43" width="234" height="344" rx="92" fill="none" stroke="#334155" stroke-width="4" stroke-opacity="0.5" />
  <rect x="521" y="46" width="228" height="338" rx="89" fill="none" stroke="#64748b" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- Window Shade Slider Channel Grooves (Left & Right) -->
  <line x1="514" y1="90" x2="514" y2="340" stroke="#1e293b" stroke-width="2" stroke-opacity="0.6" />
  <line x1="756" y1="90" x2="756" y2="340" stroke="#1e293b" stroke-width="2" stroke-opacity="0.6" />

  <!-- Ambient Light Soft Radiance into the Card's Left Section -->
  <radialGradient id="cabinAmbient" cx="640" cy="220" r="400" gradientUnits="userSpaceOnUse">
    <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.08" />
    <stop offset="45%" stop-color="#818cf8" stop-opacity="0.04" />
    <stop offset="100%" stop-color="#06101e" stop-opacity="0" />
  </radialGradient>
  <rect width="800" height="450" fill="url(#cabinAmbient)" pointer-events="none" />
</svg>
