<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Deep Korean Indigo with warm ambient undertone -->
    <linearGradient id="hanokBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1628" />
      <stop offset="50%" stop-color="#071220" />
      <stop offset="100%" stop-color="#040a14" />
    </linearGradient>

    <!-- Warm lantern glow behind traditional lattice window -->
    <radialGradient id="lanternGlow" cx="82%" cy="32%" r="55%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.32" />
      <stop offset="35%" stop-color="#d97706" stop-opacity="0.16" />
      <stop offset="70%" stop-color="#1e3a8a" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#040a14" stop-opacity="0" />
    </radialGradient>

    <!-- Hanok Tile Shading Gradient -->
    <linearGradient id="tileGrad" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#334155" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#1e293b" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.8" />
    </linearGradient>

    <!-- Lattice Wood Gradient -->
    <linearGradient id="woodGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b45309" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#78350f" stop-opacity="0.25" />
    </linearGradient>

    <pattern id="hanokLattice" width="36" height="36" patternUnits="userSpaceOnUse">
      <rect width="36" height="36" fill="none" stroke="#b45309" stroke-width="1" stroke-opacity="0.22" />
      <line x1="18" y1="0" x2="18" y2="36" stroke="#b45309" stroke-width="0.8" stroke-opacity="0.18" />
      <line x1="0" y1="18" x2="36" y2="18" stroke="#b45309" stroke-width="0.8" stroke-opacity="0.18" />
      <rect x="7" y="7" width="22" height="22" fill="none" stroke="#f59e0b" stroke-width="0.6" stroke-opacity="0.12" />
    </pattern>
  </defs>

  <!-- Base Canvas -->
  <rect width="800" height="450" fill="url(#hanokBg)" />
  <rect width="800" height="450" fill="url(#lanternGlow)" />

  <!-- Traditional Korean Wooden Window Frame & Lattice (Right side) -->
  <g transform="translate(480, 40)" opacity="0.85">
    <!-- Outer wooden window frame -->
    <rect x="0" y="0" width="290" height="370" rx="4" fill="#0c1a2d" fill-opacity="0.5" stroke="#92400e" stroke-width="3" stroke-opacity="0.35" />
    <rect x="10" y="10" width="270" height="350" rx="2" fill="url(#hanokLattice)" stroke="#d97706" stroke-width="1.2" stroke-opacity="0.25" />
    
    <!-- Central Divider Frame (Four-panel traditional sliding doors - 세살문) -->
    <line x1="145" y1="10" x2="145" y2="360" stroke="#b45309" stroke-width="3.5" stroke-opacity="0.4" />
    <line x1="10" y1="185" x2="280" y2="185" stroke="#b45309" stroke-width="3" stroke-opacity="0.35" />

    <!-- Traditional Decorative Corner Motifs (완자 무늬 모서리) -->
    <path d="M 16,16 L 36,16 L 36,24 L 24,24 L 24,36 L 16,36 Z" fill="#f59e0b" fill-opacity="0.2" />
    <path d="M 274,16 L 254,16 L 254,24 L 266,24 L 266,36 L 274,36 Z" fill="#f59e0b" fill-opacity="0.2" />
  </g>

  <!-- Majestic Korean Hanok Tile Roof Eaves (기와집 처마선과 서까래) -->
  <g opacity="0.65">
    <!-- Moon / Traditional Horizon glow -->
    <circle cx="680" cy="90" r="48" fill="#fef08a" fill-opacity="0.06" filter="blur(8px)" />

    <!-- Curved Roof Ridge (용마루) -->
    <path d="M 220,130 Q 420,105 780,70 L 795,95 Q 430,130 220,155 Z" fill="#1e293b" stroke="#475569" stroke-width="1" stroke-opacity="0.4" />
    
    <!-- Upward-sweeping Main Roof Eave (처마 곡선) -->
    <path d="M 160,180 Q 450,150 790,90 Q 750,120 480,185 Q 300,210 160,215 Z" fill="url(#tileGrad)" stroke="#64748b" stroke-width="1.5" stroke-opacity="0.5" />

    <!-- Roof Tiles Rows (기와 골) -->
    <path d="M 240,165 Q 480,135 760,82" stroke="#94a3b8" stroke-width="1" stroke-opacity="0.3" fill="none" />
    <path d="M 210,180 Q 470,148 775,88" stroke="#94a3b8" stroke-width="1.2" stroke-opacity="0.35" fill="none" />
    <path d="M 180,195 Q 460,162 785,94" stroke="#64748b" stroke-width="1" stroke-opacity="0.3" fill="none" />

    <!-- Traditional Roof End Tile Ornaments (막새 기와 문양) -->
    <g fill="#cbd5e1" fill-opacity="0.35">
      <circle cx="785" cy="92" r="5" />
      <circle cx="750" cy="100" r="4.5" />
      <circle cx="710" cy="109" r="4.5" />
      <circle cx="670" cy="118" r="4.5" />
      <circle cx="628" cy="128" r="4.5" />
      <circle cx="586" cy="138" r="4.5" />
      <circle cx="544" cy="148" r="4.5" />
      <circle cx="502" cy="158" r="4.5" />
      <circle cx="458" cy="168" r="4.5" />
      <circle cx="414" cy="177" r="4" />
      <circle cx="370" cy="186" r="4" />
      <circle cx="325" cy="194" r="4" />
      <circle cx="280" cy="201" r="4" />
      <circle cx="230" cy="208" r="3.5" />
    </g>

    <!-- Supporting Rafters (서까래 열) -->
    <g stroke="#92400e" stroke-width="2.5" stroke-opacity="0.3" stroke-linecap="round">
      <line x1="330" y1="195" x2="310" y2="230" />
      <line x1="380" y1="187" x2="365" y2="225" />
      <line x1="430" y1="178" x2="420" y2="218" />
      <line x1="480" y1="168" x2="475" y2="210" />
      <line x1="530" y1="158" x2="528" y2="202" />
      <line x1="580" y1="148" x2="582" y2="194" />
      <line x1="630" y1="138" x2="636" y2="186" />
      <line x1="680" y1="128" x2="690" y2="178" />
      <line x1="730" y1="116" x2="745" y2="168" />
      <line x1="775" y1="102" x2="795" y2="155" />
    </g>
  </g>
</svg>
