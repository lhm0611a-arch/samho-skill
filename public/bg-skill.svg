<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <!-- Background Canvas: Deep Industrial Navy/Cyan -->
    <linearGradient id="skillWeldBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#051722" />
      <stop offset="40%" stop-color="#082333" />
      <stop offset="100%" stop-color="#0c3247" />
    </linearGradient>

    <!-- Blazing Arc Flash Glow (Electric Cyan to Sun Gold) -->
    <radialGradient id="intenseArcGlow" cx="68%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="12%" stop-color="#a5f3fc" stop-opacity="0.95" />
      <stop offset="28%" stop-color="#38bdf8" stop-opacity="0.75" />
      <stop offset="50%" stop-color="#0284c7" stop-opacity="0.45" />
      <stop offset="75%" stop-color="#f59e0b" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#051722" stop-opacity="0" />
    </radialGradient>

    <!-- Heat Dispersion Glow -->
    <radialGradient id="fieryHeat" cx="68%" cy="52%" r="65%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.5" />
      <stop offset="30%" stop-color="#f97316" stop-opacity="0.3" />
      <stop offset="60%" stop-color="#ef4444" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#051722" stop-opacity="0" />
    </radialGradient>

    <!-- Heavy Steel Hull Plate Gradient -->
    <linearGradient id="hullSteel" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#164e63" />
      <stop offset="50%" stop-color="#0e7490" />
      <stop offset="100%" stop-color="#083344" />
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="450" fill="url(#skillWeldBg)" />
  <rect width="800" height="450" fill="url(#fieryHeat)" />
  <rect width="800" height="450" fill="url(#intenseArcGlow)" />

  <!-- Industrial Shipyard Giant Goliath Crane Silhouette in Distance -->
  <g opacity="0.4" stroke="#38bdf8" stroke-width="1.5" fill="none">
    <path d="M 460,50 L 780,50 L 760,70 L 480,70 Z" fill="#0891b2" fill-opacity="0.3" />
    <line x1="480" y1="70" x2="450" y2="340" stroke-width="3" stroke="#0891b2" />
    <line x1="760" y1="70" x2="790" y2="340" stroke-width="3" stroke="#0891b2" />
    <line x1="490" y1="120" x2="750" y2="120" stroke-dasharray="8,6" />
    <line x1="500" y1="180" x2="740" y2="180" stroke-dasharray="8,6" />
    <!-- Hoist Cable -->
    <line x1="620" y1="70" x2="620" y2="160" stroke="#a5f3fc" stroke-width="2" />
  </g>

  <!-- Heavy Steel Construction Beams & Hull Plates -->
  <g>
    <!-- Horizontal Steel Plate Joint -->
    <path d="M 240,270 L 800,270 L 800,310 L 240,310 Z" fill="url(#hullSteel)" stroke="#22d3ee" stroke-width="1.8" />
    
    <!-- Heavy Weld Seam Center Bead (빨갛게 달아오른 용접 비드) -->
    <line x1="240" y1="290" x2="800" y2="290" stroke="#f97316" stroke-width="3.5" stroke-linecap="round" />
    <line x1="450" y1="290" x2="800" y2="290" stroke="#fef08a" stroke-width="2" stroke-linecap="round" />
    
    <!-- Glowing Rivets along Steel Beam -->
    <g fill="#38bdf8">
      <circle cx="280" cy="280" r="3" />
      <circle cx="340" cy="280" r="3" />
      <circle cx="400" cy="280" r="3" />
      <circle cx="460" cy="280" r="3.5" fill="#fef08a" />
      <circle cx="520" cy="280" r="3.5" fill="#fef08a" />
      <circle cx="700" cy="280" r="3" fill="#67e8f9" />
      <circle cx="760" cy="280" r="3" fill="#67e8f9" />
    </g>

    <!-- Vertical Ship Hull Rib (선체 늑골 구조) -->
    <rect x="710" y="40" width="30" height="230" fill="#0c2d3d" stroke="#0891b2" stroke-width="2" />
    <rect x="430" y="70" width="22" height="200" fill="#082330" stroke="#0891b2" stroke-width="1.5" />
  </g>

  <!-- Welder Silhouette with Protective Helmet & Torch (용접사 실루엣) -->
  <g>
    <!-- Welder Body & Arm -->
    <path d="M 720,130 C 680,130 650,165 640,210 L 610,225 L 585,220 L 570,240 L 615,250 L 640,235 L 660,330 L 780,330 L 780,180 Z" fill="#021018" stroke="#0891b2" stroke-width="2" />

    <!-- Professional Welding Helmet (용접 헬멧) -->
    <path d="M 645,155 C 640,135 655,115 680,112 C 705,110 725,128 725,160 C 725,185 700,200 675,200 C 655,200 645,180 645,155 Z" fill="#01080d" stroke="#22d3ee" stroke-width="2.2" />
    
    <!-- Glowing Helmet Viewport Visor (용접면 차광 유리 반사) -->
    <rect x="644" y="146" width="20" height="28" rx="4" fill="#065f46" stroke="#34d399" stroke-width="2" transform="rotate(-12 654 160)" />
    <rect x="646" y="152" width="16" height="10" rx="2" fill="#6ee7b7" transform="rotate(-12 654 160)" />

    <!-- Welding Gun Torch Body & Gas Nozzle -->
    <path d="M 610,230 L 555,242 L 550,254 L 570,254 L 618,240 Z" fill="#475569" stroke="#94a3b8" stroke-width="1.5" />
    <polygon points="552,248 525,268 530,273 558,252" fill="#f59e0b" stroke="#fbbf24" stroke-width="1" />

    <!-- Molten Welding Pool (융융지) - Highly luminous center -->
    <ellipse cx="524" cy="272" rx="34" ry="15" fill="#f97316" />
    <ellipse cx="524" cy="272" rx="22" ry="9" fill="#fef08a" />
    <circle cx="524" cy="272" r="10" fill="#ffffff" />
    
    <!-- Piercing Electric Arc Core Light Rays -->
    <g stroke="#ffffff" stroke-width="2.5" stroke-linecap="round">
      <line x1="524" y1="272" x2="480" y2="240" stroke="#a5f3fc" stroke-width="3" />
      <line x1="524" y1="272" x2="495" y2="215" stroke="#ffffff" stroke-width="3.5" />
      <line x1="524" y1="272" x2="535" y2="205" stroke="#67e8f9" stroke-width="2.5" />
      <line x1="524" y1="272" x2="565" y2="225" stroke="#a5f3fc" />
      <line x1="524" y1="272" x2="460" y2="275" stroke="#ffffff" stroke-width="3" />
      <line x1="524" y1="272" x2="480" y2="310" stroke="#67e8f9" stroke-width="2.5" />
      <line x1="524" y1="272" x2="520" y2="330" stroke="#bae6fd" />
      <line x1="524" y1="272" x2="550" y2="315" stroke="#38bdf8" />
    </g>

    <!-- High-Energy Fiery Flying Sparks (사방으로 튀는 용접 불꽃 비산) -->
    <!-- Jet Spray 1: Long Upward-Left Arcs -->
    <path d="M 524,272 Q 470,210 410,225" fill="none" stroke="#f59e0b" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="24,10" />
    <path d="M 524,272 Q 440,165 370,195" fill="none" stroke="#ef4444" stroke-width="2" stroke-linecap="round" stroke-dasharray="30,12" />
    <path d="M 524,272 Q 410,130 320,180" fill="none" stroke="#fbbf24" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="28,14" />
    <path d="M 524,272 Q 490,140 440,110" fill="none" stroke="#fde047" stroke-width="2" stroke-linecap="round" stroke-dasharray="20,10" />

    <!-- Jet Spray 2: Downward-Left Cascade Arcs -->
    <path d="M 524,272 Q 460,320 370,365" fill="none" stroke="#f97316" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="26,14" />
    <path d="M 524,272 Q 420,340 330,410" fill="none" stroke="#eab308" stroke-width="2" stroke-linecap="round" stroke-dasharray="32,16" />
    <path d="M 524,272 Q 480,360 410,430" fill="none" stroke="#ef4444" stroke-width="2" stroke-linecap="round" stroke-dasharray="22,12" />

    <!-- Radiant Glowing Spark Particles (눈부신 불티 알갱이들) -->
    <g fill="#ffffff" stroke="#f59e0b" stroke-width="1.2">
      <circle cx="405" cy="223" r="3.5" />
      <circle cx="365" cy="193" r="3" fill="#fef08a" />
      <circle cx="316" cy="179" r="3" fill="#fbbf24" />
      <circle cx="436" cy="108" r="3.2" fill="#ffffff" />
      <circle cx="460" cy="180" r="4" fill="#ffffff" stroke="#38bdf8" />
      <circle cx="366" cy="368" r="3.5" fill="#fef08a" />
      <circle cx="325" cy="412" r="3" fill="#fbbf24" />
      <circle cx="406" cy="432" r="3.2" fill="#ef4444" />
      <circle cx="448" cy="305" r="4.5" fill="#ffffff" stroke="#f59e0b" />
      <circle cx="478" cy="252" r="3.5" fill="#fde047" />
      <circle cx="280" cy="220" r="2.5" fill="#f97316" />
    </g>
  </g>
</svg>
