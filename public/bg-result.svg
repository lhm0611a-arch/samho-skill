<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <!-- Sky Gradient: Vivid Sunset Twilight over High-Altitude Ocean of Clouds -->
    <linearGradient id="vividSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f2b5c" />
      <stop offset="35%" stop-color="#1d4ed8" />
      <stop offset="65%" stop-color="#6366f1" />
      <stop offset="85%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Golden Horizon Glow -->
    <radialGradient id="sunHorizonGlow" cx="68%" cy="65%" r="65%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.9" />
      <stop offset="25%" stop-color="#fb923c" stop-opacity="0.65" />
      <stop offset="55%" stop-color="#a855f7" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0f2b5c" stop-opacity="0" />
    </radialGradient>

    <!-- Fluffy Cloud Layer Gradient -->
    <linearGradient id="cloudBright" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>

    <linearGradient id="cloudSunsetGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffedd5" />
      <stop offset="45%" stop-color="#fda4af" />
      <stop offset="100%" stop-color="#4338ca" />
    </linearGradient>

    <!-- Airplane Window Oval Mask -->
    <clipPath id="windowClip">
      <rect x="500" y="30" width="265" height="385" rx="100" />
    </clipPath>
  </defs>

  <!-- Deep Background Base -->
  <rect width="800" height="450" fill="#061224" />

  <!-- The Sky and Clouds visible through the Oval Airplane Window -->
  <g clip-path="url(#windowClip)">
    <!-- High Altitude Sky -->
    <rect x="480" y="10" width="310" height="420" fill="url(#vividSky)" />
    <rect x="480" y="10" width="310" height="420" fill="url(#sunHorizonGlow)" />

    <!-- Luminous Sunset Horizon Line -->
    <line x1="480" y1="230" x2="800" y2="230" stroke="#fef08a" stroke-width="3" />
    
    <!-- Sunset Glare Sun Disc on Horizon -->
    <circle cx="680" cy="230" r="28" fill="#ffffff" filter="blur(4px)" />
    <circle cx="680" cy="230" r="18" fill="#fef08a" />

    <!-- Layer 1: Distant Sunset-Illuminated Clouds -->
    <path d="M 480,230 Q 520,210 560,218 Q 600,195 650,205 Q 700,188 740,210 Q 770,200 800,225 L 800,430 L 480,430 Z" fill="url(#cloudSunsetGlow)" />

    <!-- Layer 2: Rolling Billowing White Clouds (뭉게구름) -->
    <path d="M 480,265 Q 525,240 570,255 Q 615,230 665,248 Q 715,235 765,260 Q 785,250 800,270 L 800,430 L 480,430 Z" fill="url(#cloudBright)" />

    <!-- Layer 3: Fluffy Cloud Tops Foreground -->
    <path d="M 480,310 Q 530,285 580,300 Q 630,275 685,295 Q 735,280 780,310 L 800,315 L 800,430 L 480,430 Z" fill="#ffffff" />
    <path d="M 500,345 Q 560,320 620,338 Q 680,315 740,335 L 800,345 L 800,430 L 480,430 Z" fill="#f8fafc" />

    <!-- Jet Airliner Wing Slicing Through the Clouds (비행기 날개) -->
    <polygon points="480,300 680,215 710,218 610,330 480,360" fill="#0f172a" stroke="#38bdf8" stroke-width="1.8" />
    
    <!-- Wing Top Shiny Aerodynamic Metal Reflection -->
    <polygon points="490,302 678,217 684,222 510,325" fill="#e2e8f0" fill-opacity="0.35" />

    <!-- Wing Panel Lines & Flap Seams -->
    <line x1="530" y1="298" x2="625" y2="258" stroke="#64748b" stroke-width="1.5" />
    <line x1="570" y1="318" x2="665" y2="278" stroke="#64748b" stroke-width="1.5" />

    <!-- Vertical Winglet (날개 끝 윙렛) with Glowing Navigation Strobe Beacon -->
    <path d="M 680,215 L 710,218 L 718,172 L 698,174 Z" fill="#1e293b" stroke="#60a5fa" stroke-width="1.5" />
    
    <!-- Glowing Navigation Strobe Light (윙팁 항법등 비콘) -->
    <circle cx="715" cy="176" r="6" fill="#38bdf8" />
    <circle cx="715" cy="176" r="14" fill="#38bdf8" fill-opacity="0.5" filter="blur(2px)" />
    <circle cx="715" cy="176" r="2" fill="#ffffff" />

    <!-- Window Glass Glare Diagonal Reflection (비행기 이중창 유리 반사광) -->
    <path d="M 520,70 Q 640,40 735,130 Q 690,200 520,150 Z" fill="#ffffff" fill-opacity="0.12" />
    <path d="M 540,110 Q 650,85 720,155 Q 675,210 540,175 Z" fill="#ffffff" fill-opacity="0.08" />
  </g>

  <!-- Solid Aircraft Cabin Wall & Double Bezel Frame (여객기 창문 베젤) -->
  <!-- Outer Window Heavy Bezel -->
  <rect x="490" y="20" width="285" height="405" rx="110" fill="none" stroke="#091426" stroke-width="24" />
  <!-- Bezel Silver Inner Highlight Line -->
  <rect x="498" y="28" width="269" height="389" rx="102" fill="none" stroke="#334155" stroke-width="5" />
  <rect x="502" y="32" width="261" height="381" rx="98" fill="none" stroke="#94a3b8" stroke-width="1.8" />

  <!-- Window Shade Slider Grips (블라인드 가이드) -->
  <rect x="488" y="100" width="4" height="240" rx="2" fill="#1e293b" />
  <rect x="774" y="100" width="4" height="240" rx="2" fill="#1e293b" />
</svg>
