<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Deep Steel Cyan/Navy Industrial Base -->
    <linearGradient id="skillWeldBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#051c24" />
      <stop offset="50%" stop-color="#04151b" />
      <stop offset="100%" stop-color="#020c10" />
    </linearGradient>

    <!-- Intense Welding Electric Arc Glow (Cyan core to amber heat) -->
    <radialGradient id="arcCoreGlow" cx="72%" cy="45%" r="45%">
      <stop offset="0%" stop-color="#e0f2fe" stop-opacity="0.8" />
      <stop offset="15%" stop-color="#38bdf8" stop-opacity="0.55" />
      <stop offset="35%" stop-color="#0284c7" stop-opacity="0.3" />
      <stop offset="65%" stop-color="#f59e0b" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#020c10" stop-opacity="0" />
    </radialGradient>

    <!-- Hot Heat Haze Filter/Gradient -->
    <radialGradient id="heatHaze" cx="72%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25" />
      <stop offset="40%" stop-color="#ea580c" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#051c24" stop-opacity="0" />
    </radialGradient>

    <!-- Steel Plate Texture Gradient -->
    <linearGradient id="steelSeamGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0e3a47" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#164e63" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#082f3d" stop-opacity="0.5" />
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="450" fill="url(#skillWeldBg)" />
  <rect width="800" height="450" fill="url(#heatHaze)" />
  <rect width="800" height="450" fill="url(#arcCoreGlow)" />

  <!-- Industrial Steel Plate & Beams (Shipyard Hull Construction) -->
  <g opacity="0.6">
    <!-- Heavy Horizontal Steel Beam / Hull Plate Line -->
    <path d="M 280,260 L 800,260 L 800,290 L 280,290 Z" fill="url(#steelSeamGrad)" stroke="#155e75" stroke-width="1.2" stroke-opacity="0.5" />
    <line x1="280" y1="275" x2="800" y2="275" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.4" stroke-dasharray="6,4" />
    
    <!-- Vertical Ship Frame Ribs (늑골) -->
    <rect x="420" y="80" width="18" height="200" fill="#0c2e3a" stroke="#155e75" stroke-width="1" stroke-opacity="0.3" />
    <rect x="520" y="50" width="22" height="230" fill="#08242e" stroke="#155e75" stroke-width="1" stroke-opacity="0.3" />
    <rect x="760" y="30" width="26" height="250" fill="#051820" stroke="#155e75" stroke-width="1" stroke-opacity="0.3" />
    
    <!-- Rivet / Weld Bead dots along seam -->
    <g fill="#38bdf8" fill-opacity="0.4">
      <circle cx="340" cy="275" r="2.5" />
      <circle cx="380" cy="275" r="2.5" />
      <circle cx="460" cy="275" r="2.5" />
      <circle cx="500" cy="275" r="2.5" />
      <circle cx="640" cy="275" r="3" fill="#fbbf24" fill-opacity="0.7" />
      <circle cx="680" cy="275" r="3.5" fill="#fef08a" fill-opacity="0.9" />
    </g>
  </g>

  <!-- Welder Silhouette with Protective Helmet & Torch (Right side) -->
  <g opacity="0.85">
    <!-- Welder Torso & Arm holding torch -->
    <path d="M 690,140 C 660,140 640,165 635,200 L 610,215 L 590,210 L 580,225 L 615,235 L 635,225 L 650,290 L 740,290 L 740,180 Z" fill="#041720" stroke="#0e4354" stroke-width="1.5" />

    <!-- Welding Helmet Face Shield Silhouette -->
    <path d="M 645,160 C 640,145 650,130 670,128 C 690,126 705,140 705,165 C 705,185 685,195 665,195 C 650,195 645,180 645,160 Z" fill="#020c12" stroke="#164e63" stroke-width="1.8" />
    
    <!-- Helmet Tinted Visor Window with reflection -->
    <rect x="642" y="152" width="16" height="24" rx="3" fill="#065f46" stroke="#34d399" stroke-width="1.2" stroke-opacity="0.6" transform="rotate(-10 650 164)" />
    <rect x="644" y="156" width="12" height="6" rx="1" fill="#a7f3d0" fill-opacity="0.7" transform="rotate(-10 650 164)" />

    <!-- Welding Gun / Torch Body -->
    <path d="M 610,218 L 565,228 L 560,238 L 575,238 L 615,228 Z" fill="#334155" stroke="#64748b" stroke-width="1" />
    <!-- Torch Nozzle Contact Tip -->
    <polygon points="562,233 540,250 544,254 566,237" fill="#d97706" />

    <!-- Molten Welding Pool & Seam Glow -->
    <ellipse cx="542" cy="254" rx="28" ry="12" fill="#ea580c" fill-opacity="0.6" />
    <ellipse cx="542" cy="254" rx="18" ry="7" fill="#fbbf24" fill-opacity="0.8" />
    <circle cx="542" cy="254" r="7" fill="#ffffff" />
    
    <!-- Intense Arc Light Rays -->
    <g stroke="#e0f2fe" stroke-width="1.5" opacity="0.85">
      <line x1="542" y1="254" x2="510" y2="230" />
      <line x1="542" y1="254" x2="525" y2="215" />
      <line x1="542" y1="254" x2="550" y2="210" stroke-width="2" stroke="#ffffff" />
      <line x1="542" y1="254" x2="570" y2="225" />
      <line x1="542" y1="254" x2="500" y2="265" />
      <line x1="542" y1="254" x2="520" y2="285" />
      <line x1="542" y1="254" x2="560" y2="290" />
      <line x1="542" y1="254" x2="480" y2="250" stroke-width="2" stroke="#bae6fd" />
    </g>

    <!-- Flying Fiery Sparks Scattering in Arcs (용접 불꽃 비산) -->
    <!-- Arc stream 1: Upward-left spray -->
    <path d="M 542,254 Q 500,210 460,225" fill="none" stroke="#f59e0b" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="14,8" opacity="0.9" />
    <path d="M 542,254 Q 480,180 430,210" fill="none" stroke="#ef4444" stroke-width="1" stroke-linecap="round" stroke-dasharray="20,10" opacity="0.8" />
    <path d="M 542,254 Q 460,150 380,200" fill="none" stroke="#fbbf24" stroke-width="1" stroke-linecap="round" stroke-dasharray="16,12" opacity="0.75" />
    
    <!-- Arc stream 2: Downward-left scatter -->
    <path d="M 542,254 Q 490,290 420,330" fill="none" stroke="#fb923c" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="18,12" opacity="0.8" />
    <path d="M 542,254 Q 460,310 390,360" fill="none" stroke="#f59e0b" stroke-width="1" stroke-linecap="round" stroke-dasharray="25,15" opacity="0.7" />

    <!-- Individual Glowing Spark Particles -->
    <g fill="#fef08a">
      <circle cx="455" cy="223" r="2.5" />
      <circle cx="426" cy="208" r="2" />
      <circle cx="378" cy="199" r="1.8" />
      <circle cx="488" cy="195" r="2.2" />
      <circle cx="415" cy="332" r="2.5" />
      <circle cx="386" cy="362" r="2" />
      <circle cx="468" cy="285" r="3" fill="#ffffff" />
      <circle cx="510" cy="175" r="2" fill="#fbbf24" />
      <circle cx="530" cy="140" r="1.5" fill="#f59e0b" />
      <circle cx="440" cy="145" r="1.8" fill="#ef4444" />
      <circle cx="350" cy="235" r="1.5" fill="#f59e0b" />
    </g>
  </g>
</svg>
