<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <!-- Background Canvas Gradient -->
    <linearGradient id="hanokBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071322" />
      <stop offset="50%" stop-color="#0b1b30" />
      <stop offset="100%" stop-color="#14243b" />
    </linearGradient>

    <!-- Warm Golden Moon & Lantern Radiance -->
    <radialGradient id="moonGlow" cx="75%" cy="28%" r="45%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.85" />
      <stop offset="25%" stop-color="#f59e0b" stop-opacity="0.45" />
      <stop offset="60%" stop-color="#d97706" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#071322" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="lanternBacklight" cx="80%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.6" />
      <stop offset="40%" stop-color="#b45309" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#071322" stop-opacity="0" />
    </radialGradient>

    <!-- Traditional Korean Lattice Window Pattern -->
    <pattern id="vividLattice" width="32" height="32" patternUnits="userSpaceOnUse">
      <rect width="32" height="32" fill="#1e293b" fill-opacity="0.35" stroke="#f59e0b" stroke-width="1.2" stroke-opacity="0.45" />
      <line x1="16" y1="0" x2="16" y2="32" stroke="#d97706" stroke-width="1" stroke-opacity="0.5" />
      <line x1="0" y1="16" x2="32" y2="16" stroke="#d97706" stroke-width="1" stroke-opacity="0.5" />
      <rect x="7" y="7" width="18" height="18" fill="none" stroke="#fbbf24" stroke-width="0.8" stroke-opacity="0.35" />
    </pattern>

    <!-- Roof Tile Gradient -->
    <linearGradient id="tileShade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#64748b" />
      <stop offset="40%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="450" fill="url(#hanokBg)" />
  <rect width="800" height="450" fill="url(#lanternBacklight)" />
  <rect width="800" height="450" fill="url(#moonGlow)" />

  <!-- Luminous Korean Full Moon (대보름달) -->
  <circle cx="680" cy="110" r="62" fill="#fffbeb" fill-opacity="0.25" filter="blur(6px)" />
  <circle cx="680" cy="110" r="54" fill="#fef08a" fill-opacity="0.55" />
  <circle cx="680" cy="110" r="48" fill="#ffffff" fill-opacity="0.3" />

  <!-- Traditional Korean Hanok Wooden Sliding Door / Window (세살문 창호) -->
  <g transform="translate(470, 35)">
    <!-- Wooden Door Outer Frame with Rich Warm Color -->
    <rect x="0" y="0" width="310" height="380" rx="6" fill="#0f172a" fill-opacity="0.65" stroke="#d97706" stroke-width="3.5" stroke-opacity="0.8" />
    
    <!-- Warm Paper Backing with Glowing Lattice Grid -->
    <rect x="12" y="12" width="286" height="356" rx="4" fill="url(#vividLattice)" stroke="#f59e0b" stroke-width="2" stroke-opacity="0.75" />
    
    <!-- Thick Structural Wood Dividers (문살 뼈대) -->
    <line x1="155" y1="12" x2="155" y2="368" stroke="#f59e0b" stroke-width="4" stroke-opacity="0.85" />
    <line x1="12" y1="190" x2="298" y2="190" stroke="#f59e0b" stroke-width="4" stroke-opacity="0.85" />

    <!-- Traditional Decorative Corner Motifs (완자문 문양) -->
    <path d="M 18,18 L 44,18 L 44,28 L 28,28 L 28,44 L 18,44 Z" fill="#fbbf24" fill-opacity="0.7" />
    <path d="M 292,18 L 266,18 L 266,28 L 282,28 L 282,44 L 292,44 Z" fill="#fbbf24" fill-opacity="0.7" />
    <path d="M 18,362 L 44,362 L 44,352 L 28,352 L 28,336 L 18,336 Z" fill="#fbbf24" fill-opacity="0.7" />
    <path d="M 292,362 L 266,362 L 266,352 L 282,352 L 282,336 L 292,336 Z" fill="#fbbf24" fill-opacity="0.7" />

    <!-- Center Traditional Door Knob Ring (전통 문고리) -->
    <circle cx="155" cy="190" r="14" fill="#d97706" stroke="#fbbf24" stroke-width="2.5" />
    <circle cx="155" cy="204" r="10" fill="none" stroke="#f59e0b" stroke-width="3" />
  </g>

  <!-- Majestic Korean Hanok Tile Roof (처마 곡선과 기와 골) Silhouette -->
  <g>
    <!-- Roof Main Ridge (용마루) -->
    <path d="M 180,120 Q 420,80 790,35 L 800,65 Q 430,110 180,145 Z" fill="#1e293b" stroke="#94a3b8" stroke-width="1.8" />
    
    <!-- Sweeping Eaves Roof Body (처마 날개 곡선) -->
    <path d="M 120,185 Q 440,140 795,65 L 800,105 Q 460,185 120,225 Z" fill="url(#tileShade)" stroke="#cbd5e1" stroke-width="2.5" />

    <!-- Elegant Tile Ridges Lines (기와 능선) -->
    <path d="M 220,165 Q 470,120 780,55" stroke="#94a3b8" stroke-width="2" fill="none" stroke-linecap="round" />
    <path d="M 180,182 Q 460,135 790,68" stroke="#cbd5e1" stroke-width="2.2" fill="none" stroke-linecap="round" />
    <path d="M 140,200 Q 450,152 795,82" stroke="#e2e8f0" stroke-width="2.5" fill="none" stroke-linecap="round" />

    <!-- Round End Tiles with Traditional Lotus Pattern (수막새 기와) -->
    <g fill="#f1f5f9" stroke="#475569" stroke-width="1">
      <circle cx="792" cy="78" r="7" />
      <circle cx="750" cy="88" r="6.5" />
      <circle cx="705" cy="99" r="6.5" />
      <circle cx="658" cy="111" r="6.5" />
      <circle cx="610" cy="123" r="6.5" />
      <circle cx="560" cy="136" r="6.5" />
      <circle cx="510" cy="149" r="6.5" />
      <circle cx="458" cy="162" r="6.5" />
      <circle cx="405" cy="175" r="6.5" />
      <circle cx="350" cy="188" r="6" />
      <circle cx="295" cy="200" r="6" />
      <circle cx="238" cy="211" r="6" />
      <circle cx="180" cy="221" r="5.5" />
    </g>

    <!-- Traditional Wooden Rafters (서까래 기둥 열) -->
    <g stroke="#d97706" stroke-width="4" stroke-linecap="round">
      <line x1="300" y1="205" x2="280" y2="245" />
      <line x1="360" y1="192" x2="345" y2="238" />
      <line x1="420" y1="180" x2="410" y2="230" />
      <line x1="480" y1="168" x2="475" y2="222" />
      <line x1="540" y1="154" x2="540" y2="212" />
      <line x1="600" y1="140" x2="605" y2="202" />
      <line x1="660" y1="126" x2="670" y2="190" />
      <line x1="720" y1="110" x2="735" y2="178" />
      <line x1="775" y1="92" x2="795" y2="162" />
    </g>

    <!-- Traditional Pine Needle Silhouette at Bottom Right (소나무 가지) -->
    <g stroke="#1e293b" stroke-width="2" fill="none">
      <path d="M 680,410 Q 720,360 780,340" stroke-width="4" stroke="#334155" />
      <path d="M 720,360 Q 760,330 800,310" stroke-width="3" stroke="#334155" />
      <!-- Pine clusters -->
      <path d="M 750,335 L 770,310 M 750,335 L 780,325 M 750,335 L 790,340 M 750,335 L 775,355" stroke="#475569" stroke-width="1.8" />
      <path d="M 770,310 L 795,290 M 770,310 L 805,305 M 770,310 L 800,325" stroke="#475569" stroke-width="1.8" />
    </g>
  </g>
</svg>
